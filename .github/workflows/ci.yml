name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the solution
        run: dotnet build EfUi.sln -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: ./tests/EfUi.AspNetCore.Tests/bin/Release/net8.0/playwright.ps1 install chromium

      - name: Run tests
        run: dotnet test EfUi.sln -c Release --no-build
