name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet-version: 8.0.x
            target-framework: net8.0
          - dotnet-version: 9.0.x
            target-framework: net9.0
          - dotnet-version: 10.0.x
            target-framework: net10.0

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Build the core test project
        run: dotnet build tests/EfUi.Core.Tests/EfUi.Core.Tests.csproj -c Release -f ${{ matrix.target-framework }}

      - name: Build the ASP.NET Core test project
        run: dotnet build tests/EfUi.AspNetCore.Tests/EfUi.AspNetCore.Tests.csproj -c Release -f ${{ matrix.target-framework }}

      - name: Install Playwright browsers
        shell: pwsh
        run: ./tests/EfUi.AspNetCore.Tests/bin/Release/${{ matrix.target-framework }}/playwright.ps1 install chromium

      - name: Run the core tests
        run: dotnet test tests/EfUi.Core.Tests/EfUi.Core.Tests.csproj -c Release -f ${{ matrix.target-framework }} --no-build

      - name: Run the ASP.NET Core tests
        run: dotnet test tests/EfUi.AspNetCore.Tests/EfUi.AspNetCore.Tests.csproj -c Release -f ${{ matrix.target-framework }} --no-build

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          project_key="jean-fischer_ef-ui"
          organization_key="jean-fischer"
          quality_gate_wait="false"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            quality_gate_wait="true"
          fi

          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$project_key" \
            /o:"$organization_key" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.skipJreProvisioning=true \
            /d:sonar.qualitygate.wait="$quality_gate_wait"

      - name: Build the solution for SonarCloud
        run: dotnet build EfUi.sln -c Release

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
